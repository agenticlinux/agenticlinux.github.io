{% extends "base.html" %}

{% block body_class %}home{% endblock body_class %}

{% block content %}
<section class="hero">
  <div class="hero-logo">
    <img class="hero-mark"
         src="{{ get_url(path='agenticlinux-mark.png', trailing_slash=false) }}"
         alt="AgenticLinux logo: a friendly robot head"
         width="256" height="256">
  </div>
  <h1>{{ config.extra.tagline }}</h1>
  <p class="hero-sub">{{ config.extra.subtitle }}</p>
  {{<cmd c={config.extra.hero_cmd} hero={true} />}}
  <p class="actions">
    <a class="btn" href="{{ get_url(path='@/docs/installation.md') }}">Get started</a>
    <a class="btn btn-quiet" href="{{ config.extra.releases_url }}">Download</a>
  </p>
  <p class="hero-links">
    <a href="{{ get_url(path='@/docs/variants.md') }}">Variants</a>
    <span aria-hidden="true">·</span>
    <a href="{{ get_url(path='@/blog/_index.md') }}">Blog</a>
    {% if config.extra.demo_url %}
    <span aria-hidden="true">·</span>
    <a href="{{ config.extra.demo_url }}">Demo video</a>
    {% endif %}
  </p>
</section>
{% endblock content %}
