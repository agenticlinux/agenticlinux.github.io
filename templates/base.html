<!DOCTYPE html>
<html lang="{{ config.default_language }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ config.title }} · {{ config.extra.tagline }}{% endblock title %}</title>
<meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
<link rel="canonical" href="{% block canonical %}{{ current_url | default(value=config.base_url) }}{% endblock canonical %}">

<meta property="og:site_name" content="{{ config.title }}">
<meta property="og:type" content="{% block og_type %}website{% endblock og_type %}">
<meta property="og:title" content="{% block og_title %}{{ config.title }}{% endblock og_title %}">
<meta property="og:description" content="{% block og_description %}{{ config.description }}{% endblock og_description %}">
<meta property="og:url" content="{{ current_url | default(value=config.base_url) }}">
<meta property="og:image" content="{{ get_url(path='agenticlinux-mark.png', trailing_slash=false) }}">
<meta name="twitter:card" content="summary">

<link rel="alternate" type="application/atom+xml" title="{{ config.title }} blog" href="{{ get_url(path='blog/atom.xml', trailing_slash=false) }}">
<link rel="icon" href="{{ get_url(path='favicon.png', trailing_slash=false) }}" type="image/png">
<link rel="apple-touch-icon" href="{{ get_url(path='apple-touch-icon.png', trailing_slash=false) }}">
<link rel="stylesheet" href="{{ get_url(path='style.css', trailing_slash=false) }}">
</head>
<body class="{% block body_class %}{% endblock body_class %}">

<a class="skip" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ get_url(path='@/_index.md') }}"><img class="brand-mark" src="{{ get_url(path='agenticlinux-mark.png', trailing_slash=false) }}" alt="" width="28" height="28"><span>AgenticLinux</span></a>
    {% set here = current_path | default(value="") %}
    <nav class="site-nav" aria-label="Main">
      <a href="{{ get_url(path='@/docs/_index.md') }}"{% if here is starting_with(pat="/docs") %} aria-current="true"{% endif %}>Docs</a>
      <a href="{{ get_url(path='@/blog/_index.md') }}"{% if here is starting_with(pat="/blog") or here is starting_with(pat="/tags") %} aria-current="true"{% endif %}>Blog</a>
      <a class="nav-icon" href="{{ config.extra.repo_url }}" aria-label="GitHub" title="GitHub"><svg viewBox="0 0 16 16" width="23" height="23" aria-hidden="true" focusable="false" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
    </nav>
  </div>
</header>

<main id="main">
{% block content %}{% endblock content %}
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>
      <a href="{{ config.extra.repo_url }}">{{ config.extra.repo_name }}</a>
      <span aria-hidden="true">·</span>
      <span>Apache-2.0</span>
      <span aria-hidden="true">·</span>
      <a href="{{ get_url(path='blog/atom.xml', trailing_slash=false) }}">Atom feed</a>
      <span aria-hidden="true">·</span>
      <span>Built with <a href="https://www.getzola.org">Zola</a></span>
    </p>
  </div>
</footer>

<script>
document.querySelectorAll("[data-copy]").forEach(function (b) {
  if (!navigator.clipboard) return;
  b.hidden = false;
  b.addEventListener("click", function () {
    navigator.clipboard.writeText(b.getAttribute("data-copy")).then(function () {
      b.textContent = "Copied";
      setTimeout(function () { b.textContent = "Copy"; }, 1500);
    });
  });
});
</script>

</body>
</html>
